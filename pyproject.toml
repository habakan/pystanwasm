[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pystanwasm"
version = "0.1.0"
description = "Run stanwasm -- Stan compiled to WebAssembly -- from Python inside Pyodide."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
]

[project.urls]
Homepage = "https://github.com/habakan/pystanwasm"
stanwasm = "https://github.com/habakan/stanwasm"

[project.optional-dependencies]
examples = [
    "jupyterlite-core",
    "jupyterlite-pyodide-kernel",
    "jupyter_server",
    "build",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pystanwasm"]
